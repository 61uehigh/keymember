name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste passwords, Secret Keys, vault contents, tokens or your server secret here.**
        Security problems go to the private report on the Security tab instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Server
        - Web vault
        - Browser extension (Chrome)
        - Browser extension (Firefox)
        - Desktop app
        - CLI
        - Deployment (Docker / Cloud Run)
    validations:
      required: true
