# keymember on a company's own machine: the server with PGlite, behind Caddy for HTTPS.
#
#   cp deploy/.env.example deploy/.env   # then fill in KEYMEMBER_DOMAIN and KEYMEMBER_SERVER_SECRET
#   docker compose -f deploy/compose.yaml up -d
#
# The domain's DNS must point at this machine, with ports 80 and 443 open, so Caddy can get a
# certificate. Data lives in the keymember-data volume; back it up with deploy/backup.sh
# (see docs/deploy/self-hosted.md).

# Request logs would otherwise grow without limit on the host's disk
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  keymember:
    # Builds from this checkout. To run a released image instead, replace this line with
    # `image: ghcr.io/61uehigh/keymember:<version>`
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      KEYMEMBER_TRUST_PROXY: "1"
    volumes:
      - keymember-data:/data
    # Room for the database to close cleanly before Docker kills the process
    stop_grace_period: 30s
    healthcheck:
      # The slim image has no curl; Node's fetch does the same
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KEYMEMBER_DOMAIN: ${KEYMEMBER_DOMAIN:?set KEYMEMBER_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      keymember:
        condition: service_healthy
    logging: *logging

volumes:
  keymember-data:
  caddy-data:
  caddy-config:
